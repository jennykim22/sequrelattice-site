<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice Chat · 김정현</title>
<style>
  :root { --bg:#f3f4f6; --fg:#111827; --muted:#6b7280; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111318; --fg:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center;
           gap:12px; padding:12px 16px; background:var(--bg); border-bottom:1px solid rgba(127,127,127,.2); }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header a { color:var(--accent); text-decoration:none; font-size:14px; white-space:nowrap; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  canvas { width:100%; height:auto; display:block; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.15); background:#fff; }
  #status { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Lattice Chat — 양자내성 암호 기반 종단간 암호화 메신저 · 김정현</h1>
  <a href="lattice.pdf" download>PDF 다운로드</a>
</header>
<main id="pages"><p id="status">발표자료를 불러오는 중…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const container = document.getElementById("pages");
  pdfjsLib.getDocument("lattice.pdf").promise.then(async pdf => {
    document.getElementById("status").remove();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(1100, base.width * 2) / base.width * dpr;
      const vp = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width; canvas.height = vp.height;
      container.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    }
  }).catch(() => {
    document.getElementById("status").innerHTML = '미리보기를 불러오지 못했습니다. <a href="lattice.pdf">PDF로 열기</a>';
  });
</script>
</body>
</html>
